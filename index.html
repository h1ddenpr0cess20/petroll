<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22305a">
<meta name="description" content="Petroll: a hamster in a plastic ball, loose in an oil town. Roll through the suburbs, the traffic, the gas station, the oil field and the refinery, hunting golden sunflower seeds.">
<title>Petroll</title>
</head>
<body>
<div id="view"></div>

<header id="top" hidden>
  <div class="left">
    <div id="place"></div>
    <div class="gold"><span class="star">★</span><span id="gold">0/0</span></div>
  </div>
  <div class="mid">
    <span class="label">bubble</span>
    <div id="bubble"><div id="bubble-fill"></div></div>
  </div>
  <div class="right">
    <div><span class="label">seeds</span><span id="seeds">0</span></div>
    <div><span class="label">time</span><span id="clock">0:00</span></div>
  </div>
</header>

<canvas id="minimap" width="200" height="200" hidden></canvas>
<div id="banner" hidden></div>
<div id="toast" hidden></div>
<div id="pause" hidden>PAUSED<small>P to carry on</small></div>

<section id="title" hidden>
  <div class="logo">
    <h1>PETROLL</h1>
    <p class="tag">a hamster in a ball · petroleum springs</p>
  </div>
  <div class="menu">
    <button id="start" type="button">ROLL OUT</button>
    <button id="fresh" type="button" hidden>start over</button>
    <p id="best"></p>
    <p class="help">
      <span class="keys"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>WASD</kbd> roll</span>
      <span>hold the mouse or a finger — roll toward it</span>
      <span class="keys"><kbd>Q</kbd><kbd>E</kbd> or right-drag turn · wheel zoom · <kbd>C</kbd> reset view</span>
      <span class="touch">two fingers: pinch to zoom, twist to turn</span>
      <span class="keys"><kbd>P</kbd> pause · <kbd>M</kbd> mute</span>
    </p>
  </div>
</section>

<button id="mute" type="button" aria-pressed="false">sound on</button>
<div id="loading" hidden><span>warming up the engine</span></div>
<pre id="error" hidden></pre>

<script type="module" src="/src/main.js"></script>
</body>
</html>
